name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: dist/

      - name: Inspect build
        run: |
          echo "Build output:"
          find dist -maxdepth 2 -type f -print

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: app-build
          path: dist/
      - name: Look for CI build
        run: |
          echo "Looking for dist..."
          if [ -d dist ]; then
            echo "FOUND dist directory"
            find dist -maxdepth 2 -type f -print
          else
            echo "dist does not exist"
          fi
