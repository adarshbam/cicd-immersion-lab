name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Inspect build
        run: |
          echo "Build output:"
          find dist -maxdepth 2 -type f -print

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Look for CI build
        run: |
          echo "Looking for dist..."
          if [ -d dist ]; then
            echo "FOUND dist directory"
            find dist -maxdepth 2 -type f -print
          else
            echo "dist does not exist"
          fi
