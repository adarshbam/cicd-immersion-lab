name: CI and CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: ci
    runs-on: ubuntu-latest
    environment: TEST

    steps:
      - name: Deploy to TEST
        run: |
          echo "Deploying commit $GITHUB_SHA to TEST"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Deploy to PROD
        run: |
          echo "Deploying commit $GITHUB_SHA to PROD"
