name: Security Experiment

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Test input"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unsafe:
    runs-on: ubuntu-latest

    steps:
      - name: Unsafe input handling
        run: |
          echo "${{ inputs.message }}"

  safe:
    runs-on: ubuntu-latest

    steps:
      - name: Safe input handling
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          printf '%s\n' "$MESSAGE"
