name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect runner
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Workspace:"
          pwd
          echo "Contents:"
          ls -la
          echo "Kernel:"
          uname -a

      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create runner file
        run: |
          echo "created by CI job" > runner-file.txt
          echo "CI job files:"
          ls -la

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: |
          echo "Starting deployment..."
          sleep 5
          echo "Deploying application."
          sleep 5
          echo "Deployment complete."
      - name: Inspect filesystem
        run: |
          echo "Looking for runner-file.txt..."
          ls -la
          if [ -f runner-file.txt ]; then
            echo "FOUND:"
            cat runner-file.txt
          else
            echo "NOT FOUND"
          fi
