name: CI and CD

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Record artifact version
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "$GITHUB_SHA" > dist/commit.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: dist/

  cd:
    needs: ci
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: app-build
          path: dist/

      - name: Verify artifact version
        run: |
          echo "Artifact was built from:"
          cat dist/commit.txt

      - name: Simulate deployment
        run: |
          echo "Starting deployment for latest commit..."
          sleep 30
          echo "Deployment complete."
