name: CI and CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git fetch origin deployment-state:refs/remotes/origin/deployment-state || true

          if git show-ref --verify --quiet refs/remotes/origin/deployment-state; then
            git switch -C deployment-state origin/deployment-state
          else
            git switch -c deployment-state
          fi

          if [ -f deployment-counter.txt ]; then
            COUNT=$(cat deployment-counter.txt)
          else
            COUNT=0
          fi

          COUNT=$((COUNT + 1))

          echo "$COUNT" > deployment-counter.txt

          echo "Deployment #$COUNT"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run attempt: $GITHUB_RUN_ATTEMPT"
          echo "Commit: $GITHUB_SHA"

          echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA" >> deployment-history.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment-counter.txt deployment-history.log
          git commit -m "Record deployment #$COUNT"
          git push origin HEAD:deployment-state
